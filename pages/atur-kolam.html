<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atur Kolam</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
}
.phone {
  width: 100%;
  max-width: 400px;
  height: 100vh;
  background: white;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}
.header {
  background: #2563eb;
  color: white;
  padding: 20px 16px;
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom-left-radius: 24px;
  border-bottom-right-radius: 24px;
}
.back-arrow {
  font-size: 28px;
  cursor: pointer;
  background: none;
  border: none;
  color: white;
  font-weight: bold;
  line-height: 1;
}
.header h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 600;
}
.content {
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}
.card {
  background: #f8fafc;
  border-radius: 24px;
  padding: 18px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  border: 1px solid #e2e8f0;
}
.title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
  color: #0f172a;
}
.mode-group {
  display: flex;
  gap: 12px;
  margin-bottom: 8px;
}
.mode-btn {
  flex: 1;
  padding: 10px;
  border-radius: 40px;
  border: 1px solid #cbd5e1;
  background: white;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.2s;
}
.mode-btn.active {
  background: #2563eb;
  color: white;
  border-color: #2563eb;
}
.info {
  font-size: 12px;
  color: #475569;
  margin-top: 8px;
}
.input-group {
  margin: 16px 0 8px;
}
.input-group label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 6px;
  color: #334155;
}
.input-group input {
  width: 100%;
  padding: 12px;
  border-radius: 16px;
  border: 1px solid #cbd5e1;
  font-size: 16px;
}
.btn {
  width: 100%;
  padding: 12px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  margin-top: 12px;
  font-weight: 600;
  font-size: 16px;
  transition: 0.2s;
}
.btn.primary {
  background: #22c55e;
  color: white;
}
.btn.danger {
  background: #ef4444;
  color: white;
}
.btn.secondary {
  background: #f1f5f9;
  color: #1e293b;
  border: 1px solid #cbd5e1;
}
.popup-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.popup-box {
  background: white;
  padding: 24px;
  border-radius: 28px;
  width: 280px;
  text-align: center;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
}
.popup-box button {
  margin-top: 20px;
  padding: 10px 24px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  background: #2563eb;
  color: white;
  font-weight: 500;
}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <button class="back-arrow" id="backBtn">←</button>
    <h2 id="pageTitle">Atur Kolam</h2>
  </div>
  <div class="content">
    <div class="card">
      <div class="title">Mode Operasi</div>
      <div class="mode-group">
        <button class="mode-btn" id="btnAuto">Auto</button>
        <button class="mode-btn" id="btnManual">Manual</button>
      </div>
      <div class="info">Auto = sistem akan kuras otomatis jika amonia melebihi batas</div>
    </div>

    <div class="card" id="autoSetting">
      <div class="title">Pengaturan Otomatis</div>
      <div class="input-group">
        <label>Batas Amonia (PPM)</label>
        <input type="number" id="threshold" step="0.01" placeholder="Contoh: 0.5">
      </div>
      <div class="input-group">
        <label>Cooldown Notifikasi (menit)</label>
        <input type="number" id="cooldown" step="1" min="1" placeholder="30">
      </div>
      <div class="info">Jika amonia melebihi batas, server akan mengirim perintah kuras. Notifikasi hanya dikirim setiap X menit.</div>
    </div>

    <div class="card">
      <div class="title">Kontrol Manual</div>
      <button class="btn danger" id="btnKuras">💧 Kuras Sekarang</button>
      <button class="btn primary" id="btnSave">💾 Simpan Pengaturan</button>
    </div>
  </div>
</div>

<div id="popup" class="popup-overlay">
  <div class="popup-box">
    <p id="popupMessage"></p>
    <button id="popupClose">Tutup</button>
  </div>
</div>

<script src="scripts/helpers.js"></script>
<script>
  // Helper untuk memanggil API menggunakan token (dari helpers.js)
  async function apiRequest(endpoint, options = {}) {
    try {
      return await makeApiRequest(endpoint, options);
    } catch (e) {
      console.error('API Error:', e);
      return null;
    }
  }

  // Ambil ID kolam dari URL
  const urlParams = new URLSearchParams(window.location.search);
  const kolamId = urlParams.get('id');
  if (!kolamId) {
    alert('ID kolam tidak ditemukan');
    window.location.href = 'dashboard.html';
  }

  // Elemen DOM
  const pageTitle = document.getElementById('pageTitle');
  const btnAuto = document.getElementById('btnAuto');
  const btnManual = document.getElementById('btnManual');
  const autoSettingDiv = document.getElementById('autoSetting');
  const thresholdInput = document.getElementById('threshold');
  const cooldownInput = document.getElementById('cooldown');
  const btnSave = document.getElementById('btnSave');
  const btnKuras = document.getElementById('btnKuras');
  const backBtn = document.getElementById('backBtn');
  const popup = document.getElementById('popup');
  const popupMessage = document.getElementById('popupMessage');
  const popupClose = document.getElementById('popupClose');

  function showPopup(msg, isError = false) {
    popupMessage.innerText = msg;
    popup.style.display = 'flex';
    // Optional: ubah warna tombol jika error? biarkan sederhana
  }

  // Memuat data kolam dari API
  async function loadKolam() {
    const data = await apiRequest(`/kolam/${kolamId}/detail`);
    if (!data) {
      showPopup('Gagal memuat data kolam');
      return;
    }
    const kolam = data.kolam;
    if (!kolam) {
      showPopup('Data kolam tidak ditemukan');
      return;
    }

    pageTitle.innerText = `Atur ${kolam.nama_kolam}`;

    // Mode
    const isAuto = kolam.pengurasan_otomatis === true || kolam.pengurasan_otomatis === 1;
    if (isAuto) {
      btnAuto.classList.add('active');
      btnManual.classList.remove('active');
      autoSettingDiv.style.display = 'block';
    } else {
      btnManual.classList.add('active');
      btnAuto.classList.remove('active');
      autoSettingDiv.style.display = 'none';
    }

    // Nilai input
    thresholdInput.value = kolam.batasan_amonia !== null ? kolam.batasan_amonia : 0.5;
    cooldownInput.value = kolam.cooldown_menit !== null ? kolam.cooldown_menit : 30;
  }

  // Menyimpan pengaturan
  async function saveSettings() {
    const isAuto = btnAuto.classList.contains('active');
    const batasan = parseFloat(thresholdInput.value);
    const cooldown = parseInt(cooldownInput.value, 10);

    if (isNaN(batasan) || batasan <= 0) {
      showPopup('Batas amonia harus angka positif');
      return;
    }
    if (isNaN(cooldown) || cooldown < 1) {
      showPopup('Cooldown minimal 1 menit');
      return;
    }

    const payload = {
      pengurasan_otomatis: isAuto,
      batasan_amonia: batasan,
      cooldown_menit: cooldown
    };

    const result = await apiRequest(`/kolam/${kolamId}`, {
      method: 'PUT',
      body: JSON.stringify(payload)
    });

    if (result && result.message) {
      showPopup('Pengaturan berhasil disimpan');
    } else {
      showPopup('Gagal menyimpan pengaturan');
    }
  }

  // Kuras manual
  async function kurasManual() {
    const result = await apiRequest(`/kolam/${kolamId}/kuras`, { method: 'POST' });
    if (result && result.message) {
      showPopup('Perintah kuras manual telah dikirim');
    } else {
      showPopup('Gagal mengirim perintah kuras');
    }
  }

  // Event listeners
  btnAuto.addEventListener('click', () => {
    btnAuto.classList.add('active');
    btnManual.classList.remove('active');
    autoSettingDiv.style.display = 'block';
  });
  btnManual.addEventListener('click', () => {
    btnManual.classList.add('active');
    btnAuto.classList.remove('active');
    autoSettingDiv.style.display = 'none';
  });
  btnSave.addEventListener('click', saveSettings);
  btnKuras.addEventListener('click', kurasManual);
  backBtn.addEventListener('click', () => {
    window.location.href = 'dashboard.html';
  });
  popupClose.addEventListener('click', () => {
    popup.style.display = 'none';
  });

  // Load data
  loadKolam();
</script>
</body>
</html>
