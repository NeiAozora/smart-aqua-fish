<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Riwayat Pencacatan Kolam</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #f5f5f5;
  display: flex;
  justify-content: center;
}
.phone {
  width: 100%;
  max-width: 400px;
  height: 100vh;
  background: white;
  display: flex;
  flex-direction: column;
  box-shadow: 0 0 20px rgba(0,0,0,0.1);
}
.header {
  background: #2563eb;
  color: white;
  padding: 20px 16px;
  border-bottom-left-radius: 24px;
  border-bottom-right-radius: 24px;
}
.header h2 {
  font-size: 20px;
  font-weight: 600;
  margin: 0;
}
.history-list {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 90px;
}
/* Card dengan border kiri berwarna */
.history-card {
  background: #f8fafc;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  border-left: 6px solid;
  position: relative;
}
/* Warna border berdasarkan jenis */
.card-amonia { border-left-color: #ef4444; }
.card-device { border-left-color: #f97316; }
.card-pengurasan { border-left-color: #10b981; }

.delete-btn {
  position: absolute;
  bottom: 12px;
  right: 12px;
  background: none;
  border: none;
  font-size: 18px;
  cursor: pointer;
  color: #ef4444;
  padding: 4px;
}
.history-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.kolam-name {
  font-size: 16px;
  font-weight: 700;
  color: #0f172a;
}
.jenis-badge {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  color: white;
  font-weight: 500;
}
.badge-amonia { background: #ef4444; }
.badge-device { background: #f97316; }
.badge-pengurasan { background: #10b981; }

.pesan {
  font-size: 14px;
  color: #334155;
  margin: 8px 0;
  line-height: 1.4;
}
.time {
  font-size: 12px;
  color: #64748b;
  margin-top: 8px;
  text-align: right;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  max-width: 400px;
  height: 70px;
  background: white;
  border-top: 1px solid #e2e8f0;
  display: flex;
  justify-content: space-around;
  align-items: center;
}
.nav-item {
  cursor: pointer;
  transition: all 0.2s;
  opacity: 0.6;
  width: 32px;
}
.nav-item.active {
  opacity: 1;
  filter: drop-shadow(0 0 4px #3b82f6);
}
.loading-spinner, .empty-message {
  text-align: center;
  padding: 40px;
  color: #64748b;
}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <h2>Riwayat Pencacatan Kolam</h2>
  </div>
  <div class="history-list" id="historyContainer">
    <div class="loading-spinner" id="loadingIndicator">Memuat riwayat...</div>
  </div>
</div>
<div class="bottom-nav">
  <img class="nav-item" id="navDashboard" src="assets/tap.svg" alt="Dashboard">
  <img class="nav-item" id="navHistory" src="assets/history.svg" alt="Riwayat">
</div>

<script src="scripts/helpers.js"></script>
<script>
  // Helper API dengan token
  async function apiRequest(endpoint, options = {}) {
    try {
      return await makeApiRequest(endpoint, options);
    } catch (e) {
      console.error('API Error:', e);
      return null;
    }
  }

  const token = localStorage.getItem('token');
  if (!token) window.location.href = 'login.html';

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  // Mapping jenis ke badge teks dan kelas warna
  function getJenisInfo(jenis) {
    switch(jenis) {
      case 'amonia': return { text: '⚠️ Amonia', badgeClass: 'badge-amonia', cardClass: 'card-amonia' };
      case 'device': return { text: '📟 Device', badgeClass: 'badge-device', cardClass: 'card-device' };
      case 'pengurasan': return { text: '💧 Pengurasan', badgeClass: 'badge-pengurasan', cardClass: 'card-pengurasan' };
      default: return { text: '📄 Info', badgeClass: 'badge-amonia', cardClass: 'card-amonia' };
    }
  }

  function createHistoryCard(notif) {
    const card = document.createElement('div');
    card.className = `history-card ${getJenisInfo(notif.jenis).cardClass}`;
    card.dataset.id = notif.id_pemberitahuan;

    const jenisInfo = getJenisInfo(notif.jenis);
    
    card.innerHTML = `
      <button class="delete-btn" data-id="${notif.id_pemberitahuan}">✕</button>
      <div class="history-top">
        <div class="kolam-name">${escapeHtml(notif.nama_kolam)}</div>
        <div class="jenis-badge ${jenisInfo.badgeClass}">${jenisInfo.text}</div>
      </div>
      <div class="pesan">${escapeHtml(notif.pesan)}</div>
      <div class="time">${formatDate(notif.waktu_dibuat)}</div>
    `;

    const delBtn = card.querySelector('.delete-btn');
    delBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (confirm('Hapus riwayat ini?')) {
        const result = await apiRequest(`/notifikasi/${notif.id_pemberitahuan}`, { method: 'DELETE' });
        if (result && result.message) {
          card.remove();
          const container = document.getElementById('historyContainer');
          if (container.children.length === 0 || (container.children.length === 1 && container.children[0].classList.contains('loading-spinner'))) {
            showEmptyMessage();
          }
        } else {
          alert('Gagal menghapus riwayat');
        }
      }
    });

    return card;
  }

  function showEmptyMessage() {
    const container = document.getElementById('historyContainer');
    const loading = document.getElementById('loadingIndicator');
    if (loading) loading.remove();
    const emptyMsg = document.createElement('div');
    emptyMsg.className = 'empty-message';
    emptyMsg.innerText = 'Belum ada pemberitahuan';
    container.appendChild(emptyMsg);
  }

  async function loadHistory() {
    const container = document.getElementById('historyContainer');
    const loadingIndicator = document.getElementById('loadingIndicator');
    
    // Ambil SEMUA notifikasi (tanpa filter jenis), limit 100
    const result = await apiRequest('/notifikasi?limit=100');
    
    if (loadingIndicator) loadingIndicator.remove();
    
    if (!result || !result.data || result.data.length === 0) {
      showEmptyMessage();
      return;
    }
    
    container.innerHTML = '';
    
    // Urutkan dari terbaru
    const items = result.data.sort((a, b) => new Date(b.waktu_dibuat) - new Date(a.waktu_dibuat));
    
    for (const notif of items) {
      const card = createHistoryCard(notif);
      container.appendChild(card);
    }
  }

  // Navigasi
  function setActiveNav() {
    document.getElementById('navDashboard').classList.remove('active');
    document.getElementById('navHistory').classList.add('active');
  }
  document.getElementById('navDashboard').addEventListener('click', () => {
    window.location.href = 'dashboard.html';
  });
  document.getElementById('navHistory').addEventListener('click', () => {
    window.location.reload();
  });

  setActiveNav();
  loadHistory();
</script>
</body>
</html>
