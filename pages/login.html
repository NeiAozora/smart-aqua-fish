<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login - IoT Kolam</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .phone {
    width: 100%;
    max-width: 400px;
    height: 100vh;
    background: white;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
  }

  /* konten utama agar bisa di-scroll jika perlu */
  .content {
    padding: 0 20px 30px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .logo {
    width: 65%;
    max-width: 200px;
    display: block;
    margin: 40px auto 20px;
  }

  .welcome {
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    color: #1e293b;
    margin: 20px 0 30px;
    line-height: 1.3;
  }

  .form-group {
    margin-bottom: 20px;
  }

  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #334155;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    height: 52px;
    border-radius: 16px;
    border: 1px solid #cbd5e1;
    padding: 0 16px;
    font-size: 16px;
    background: white;
    transition: all 0.2s;
  }

  input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }

  .login-btn {
    width: 100%;
    height: 52px;
    border: none;
    border-radius: 28px;
    background: #2563eb;
    color: white;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    transition: 0.2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .login-btn:active {
    transform: scale(0.97);
    background: #1d4ed8;
  }

  .error-message {
    text-align: center;
    color: #dc2626;
    font-size: 14px;
    margin-top: 16px;
    background: #fee2e2;
    padding: 10px;
    border-radius: 12px;
  }

  /* tambahan space bawah agar tidak terlalu menempel */
  .spacer {
    flex: 1;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="content">
    <img class="logo" src="assets/logo.png" alt="Logo" onerror="this.src='https://placehold.co/200x80?text=Logo'">
    <div class="welcome">
      Selamat datang<br>Petani
    </div>

    <div class="form-group">
      <label>Username</label>
      <input type="text" id="username" placeholder="Masukkan username" value="admin">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Masukkan password" value="password">
    </div>

    <button class="login-btn" id="loginBtn">Login</button>
    <div id="errorMsg" class="error-message" style="display: none;"></div>
    <div class="spacer"></div>
  </div>
</div>

<script src="scripts/helpers.js"></script>
<script>
  const API_BASE_URL = 'http://localhost:8000/api';

  const loginBtn = document.getElementById('loginBtn');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const errorDiv = document.getElementById('errorMsg');

  loginBtn.addEventListener('click', async () => {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;

    if (!username || !password) {
      errorDiv.style.display = 'block';
      errorDiv.innerText = 'Username dan password harus diisi';
      return;
    }

    errorDiv.style.display = 'none';

    try {
      const response = await fetch(`${API_BASE_URL}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const responseText = await response.text();

      if (isHtmlFileProcedure && typeof isHtmlFileProcedure === 'function' && isHtmlFileProcedure(responseText)) {
        return;
      }

      let data;
      try {
        data = JSON.parse(responseText);
      } catch (e) {
        errorDiv.style.display = 'block';
        errorDiv.innerText = 'Respons server tidak valid';
        return;
      }

      if (response.ok && data.token) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'dashboard.html';
      } else {
        errorDiv.style.display = 'block';
        errorDiv.innerText = data.message || 'Login gagal, periksa username dan password';
      }
    } catch (err) {
      console.error('Login error:', err);
      errorDiv.style.display = 'block';
      errorDiv.innerText = 'Gagal terhubung ke server';
    }
  });
</script>
</body>
</html>
